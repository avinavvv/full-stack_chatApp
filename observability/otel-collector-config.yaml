receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/log_resource:
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], attributes["service.name"]) where attributes["service.name"] != nil
  memory_limiter:
    check_interval: 5s
    limit_mib: 192
    spike_limit_mib: 48

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp/tempo:
    endpoint: http://observex-tempo.observability.svc.cluster.local:4318
  otlphttp/loki:
    endpoint: http://observex-loki.observability.svc.cluster.local:3100/otlp
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/log_resource, batch]
      exporters: [otlphttp/loki, debug]
