apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observex
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/avinavvv/full-stack_chatApp.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: observex

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
