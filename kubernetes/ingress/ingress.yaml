apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observex-ingress
  namespace: observex
spec:
  ingressClassName: nginx
  rules:
    - host: observex.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
