apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: observex
  labels:
    app: backend
    environment: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        environment: dev

    spec:
      containers:
        - name: backend
          image: avinavv/observex-backend:v3
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5001
              name: http

          envFrom:
            - configMapRef:
                name: backend-config

          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: observex-backend-secret
                  key: MONGODB_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: observex-backend-secret
                  key: JWT_SECRET

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
